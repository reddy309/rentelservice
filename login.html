<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EstateNest owner login portal for property management."
    />

    <title>property management& rental service</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="icon"
      type="image/png"
      sizes="120x120"
      href="images/logo rentel1.png"
    />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <!-- HEADER CONTROLS -->
    <div class="header-actions">
      <button
        type="button"
        class="rtl-button"
        id="rtlToggle"
        aria-label="Switch page direction"
        title="Switch direction"
      >
        <i data-lucide="languages"></i>
        <span id="directionLabel">LTR</span>
      </button>

      <button
        type="button"
        class="icon-button"
        id="darkToggle"
        aria-label="Switch color theme"
        title="Switch theme"
      >
        <i data-lucide="moon" id="themeIcon"></i>
      </button>
    </div>

    <!-- LOGIN PAGE -->
    <main class="login-page">
      <section class="login-card" aria-labelledby="loginTitle">
        <!-- LOGO + BRAND NAME + TAGLINE -->
        <div class="brand-area">
          <a href="index.html" class="brand" aria-label="EstateNest home">
            <img
              src="images/logo rentel1.png"
              alt="EstateNest logo"
              class="brand-logo"
              onerror="this.classList.add('logo-missing')"
            />

            <span class="brand-name">
              Estate<span class="brand-highlight">Nest</span>
            </span>
          </a>
          <p class="tagline">Your Property, Our Pride.</p>
        </div>

        <!-- LOGIN HEADING -->
        <div class="login-heading">
          <span class="eyebrow">WELCOME BACK</span>
          <h1 id="loginTitle">Login</h1>
          <p>Sign in to manage your properties with confidence.</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>

            <div class="input-wrapper">
              <i data-lucide="mail" aria-hidden="true"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="input-wrapper">
              <i data-lucide="lock-keyhole" aria-hidden="true"></i>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="6"
                required
              />

              <button
                type="button"
                id="passwordToggle"
                aria-label="Show password"
                aria-pressed="false"
              ></button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me" for="rememberMe">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span>Remember me</span>
            </label>

            <a href="forgot-password.html">Forgot Password?</a>
          </div>

          <button type="submit" class="login-button">
            <span>Login</span>
            <i data-lucide="arrow-right" aria-hidden="true"></i>
          </button>

          <p
            class="form-message"
            id="formMessage"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <!-- SOCIAL DIVIDER -->
        <div class="social-divider">
          <span></span>
          <p>OR CONTINUE WITH</p>
          <span></span>
        </div>

        <!-- GOOGLE + APPLE SIDE BY SIDE -->
        <div class="social-login">
          <button type="button" class="social-button" id="googleLogin">
            <svg
              class="google-logo"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 48 48"
              aria-hidden="true"
            >
              <path
                fill="#4285F4"
                d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"
              />
              <path
                fill="#34A853"
                d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"
              />
              <path
                fill="#FBBC05"
                d="M12.6 27.5a12 12 0 0 1 0-7V15H5.8a20 20 0 0 0 0 18l6.8-5.5z"
              />
              <path
                fill="#EA4335"
                d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.5c1.6-4.8 6.1-8.4 11.4-8.4z"
              />
            </svg>
            <span>Google</span>
          </button>

          <button type="button" class="social-button" id="appleLogin">
            <svg
              class="apple-logo"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 384 512"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.4 0 187.1 0 279.3c0 27.2 5 55.3 15 84.1 13.3 36.7 61.3 126.6 111.4 125.1 26.2-.6 44.7-18.6 77.5-18.6 31.8 0 49.9 18.6 79.1 18.6 50.5-.7 93.9-82.4 106.6-119.2-67.9-32-64.1-98.7-70.9-100.6zM261.8 104.5C289.2 72 286.7 42.4 285.9 32c-24.2 1.4-52.2 16.5-68.1 35.3-17.5 20.1-27.8 45-25.6 72.9 26.2 2 50.1-11.4 69.6-35.7z"
                transform="translate(0 10) scale(.95)"
              />
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <!-- CONTACT -->
        <p class="signup-text">
          Need help accessing your account?
          <a href="signup.html">SignUp</a>
        </p>
      </section>
    </main>

    <script src="login.js"></script>

    <script src="main.js"></script>
  </body>
</html>
